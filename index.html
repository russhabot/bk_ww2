<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d18">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <title>Burnt Kingdoms: 1930</title>
  <style>
    :root{
      color-scheme:dark;--bg:#080d18;--surface:#111a2a;--surface2:#172338;
      --line:#273753;--text:#edf3fc;--muted:#9aaac2;--gold:#f6c86b;
      --cyan:#64d6d0;--orange:#ff875d;--green:#65d5a4;--red:#ff7888;
      --shadow:0 18px 45px #02061188
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -12%,#283b56 0,transparent 40%),radial-gradient(ellipse at 5% 25%,#271c31 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.8 Vazirmatn,Tahoma,sans-serif;padding:12px 12px 92px}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    h1,h2,h3,p{margin-top:0}
    h2{font-size:19px;line-height:1.5;margin:4px 0 14px;color:var(--gold)}
    h3{font-size:15px;margin:0 0 4px}
    small,.muted{color:var(--muted)}
    .wrap{max-width:760px;margin:auto}
    .top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#f6c86b,#ff875d);color:#172031;font-size:21px;box-shadow:0 8px 24px #ff875d33}
    .brand strong{display:block;font-size:14px;letter-spacing:.2px}
    .brand small{display:block;font-size:10px;line-height:1.2}
    .season-pill{border:1px solid var(--line);background:#0c1524cc;border-radius:99px;padding:5px 10px;color:var(--cyan);font-size:11px}
    .card{background:linear-gradient(145deg,#141f32ee,#101827f2);border:1px solid var(--line);border-radius:19px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
    .hero{position:relative;overflow:hidden;padding:22px 16px;background:linear-gradient(135deg,#1b2a40,#111827 64%,#242033);text-align:center}
    .hero .flag{width:96px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--gold);box-shadow:0 8px 20px #00000088;margin:8px auto;display:block}
    .hero h1{font-size:22px;margin:6px 0 0;font-weight:900}
    .hero .greeting{color:var(--gold);font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .stat{border:1px solid #263650;background:#0d1625;border-radius:15px;padding:11px 12px;min-height:78px}
    .stat .label{font-size:11px;color:var(--muted)}
    .stat strong{display:block;margin-top:2px;font-size:18px;line-height:1.5;color:var(--text);font-weight:800}
    .stat em{font-style:normal;color:var(--gold);font-size:10px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
    .section-head b{font-size:13px}
    .button{border:1px solid transparent;border-radius:11px;padding:8px 12px;background:linear-gradient(135deg,#f7cf7a,#e8a94e);color:#182031;font-weight:800;font-size:12px;box-shadow:0 5px 16px #e8a94e1c;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
    .button.secondary{background:#18253a;color:var(--cyan);border-color:#314561;box-shadow:none}
    .button.ghost{background:transparent;color:var(--muted);border-color:#31415a;box-shadow:none}
    .button.danger{background:#381d2a;color:#ff9bab;border-color:#673144;box-shadow:none}
    .button.wide{width:100%;padding:12px;margin-top:8px}
    .button:active{transform:scale(.98)}
    .button:disabled{opacity:.45;cursor:not-allowed}
    input,textarea,select{width:100%;border:1px solid #2b3c58;border-radius:12px;padding:10px 11px;background:#0a1321;color:var(--text);outline:none;margin:5px 0}
    input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #64d6d014}
    .search-wrap{position:relative;margin:10px 0}
    .search-wrap input{padding-right:38px}
    .search-icon{position:absolute;right:13px;top:13px;color:var(--muted);pointer-events:none}
    .pill{display:inline-block;padding:2px 8px;border-radius:99px;color:var(--cyan);background:#123233;border:1px solid #235251;font-size:10px}
    .meter{height:8px;background:#080e18;border-radius:99px;overflow:hidden;margin:7px 1px 1px}
    .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--gold),var(--green))}
    
    /* Country grid in bk_bott style */
    .flag-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    @media(min-width:620px){body{padding:20px 18px 100px}.flag-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    .country{border:1px solid #263650;background:#0d1625;border-radius:14px;text-align:center;padding:9px 7px;cursor:pointer;font-size:11px;min-width:0;transition:transform .15s,border-color .15s;display:flex;flex-direction:column;align-items:center}
    .country:hover{border-color:var(--gold)}
    .country:active{transform:scale(.97)}
    .country.taken{opacity:.35;pointer-events:none;filter:grayscale(1)}
    .flag-frame{width:100%;height:52px;border-radius:8px;overflow:hidden;background:#050912;border:1px solid #24344d;margin-bottom:6px;display:grid;place-items:center}
    .flag-frame img{width:100%;height:100%;object-fit:cover;display:block}
    .country-name-txt{font-size:12px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:4px;width:100%;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
    .badges-line{display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:6px}
    .badge-icon{width:20px;height:20px;border-radius:50%;object-fit:contain;filter:drop-shadow(0 2px 4px #00000099)}
    .leader-tag{display:flex;align-items:center;gap:4px;background:#142033;border:1px solid #263852;border-radius:20px;padding:2px 6px;width:100%;margin-top:auto}
    .leader-avatar{width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);flex-shrink:0}
    .leader-name-txt{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right}
    .country .country-owner{display:block;margin-top:5px;font-size:10px;font-weight:600;line-height:1.4;overflow-wrap:anywhere;color:#7ee787;background:rgba(126,231,135,0.08);padding:2px 6px;border-radius:6px;border:1px solid rgba(126,231,135,0.2);width:100%}
    
    /* Filter chips */
    .filters-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:8px 0;scrollbar-width:none}
    .filter-chip{background:#121c2e;border:1px solid #263852;border-radius:99px;padding:5px 12px;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s}
    .filter-chip.active{background:var(--surface2);border-color:var(--gold);color:var(--gold);font-weight:700}
    
    /* 1930 Map container */
    #map-box{width:100%;height:440px;border-radius:15px;overflow:hidden;border:1px solid var(--line);margin:10px 0;background:#090f1a}
    
    .empty{text-align:center;padding:24px 10px;color:var(--muted)}
    #toast{position:fixed;z-index:99;bottom:82px;left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#edf3fc;color:#101827;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:700;transition:.2s;max-width:90vw;text-align:center;box-shadow:0 8px 24px #000a}
    #toast.show{opacity:1;transform:translate(-50%,0)}
    .loading{display:grid;place-items:center;min-height:45vh;color:var(--muted)}
    .spinner{width:27px;height:27px;border:3px solid #33445c;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 9px}
    @keyframes spin{to{transform:rotate(360deg)}}
    
    /* Music widget */
    .music-widget{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:#0e1726;border:1px solid #23354e;font-size:11px;margin-bottom:12px}
  </style>
</head>

  function toast(text){

    e.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => e.classList.remove('show'), 2600);
  }

  function toggleMusic(){
    const audio = $('#bg-music');
    if(!audio.src){
      audio.src = S?.bg_music || "https://ia800501.us.archive.org/31/items/ww2-epic-military-march/ww2_march.mp3";
    }
    if(audio.paused){
      audio.play().then(() => {
        musicPlaying = true;
        $('#btn-music').textContent = '⏸️ توقف';
      }).catch(() => toast('برای پخش صوت ابتدا در صفحه لمس کنید'));
    } else {
      audio.pause();
      musicPlaying = false;
      $('#btn-music').textContent = '▶️ پخش';
    }
  }

  async function call(action, data = {}){
    try {
      const resp = await fetch('/api/' + encodeURIComponent(action), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...data, init: tg?.initData || '' })
      });
      const res = await resp.json();
      if(res.s) {
        S = res.s;
        if(S.membership) {
          membershipChecked = true;
          userIsMember = !!S.membership.is_member;
        }
      }
      if(res.err) {
        toast(res.err);
      }
      return res;
    } catch(e) {
      console.error(e);
      toast('ارتباط با سرور برقرار نشد.');
      return { err: 'Network error' };
    }
  }

  async function checkJoinMembership(){
    const btn = $('#btn-verify-join');
    if(btn){ btn.disabled = true; btn.textContent = '⏳ در حال استعلام عضویت از تلگرام…'; }
    const res = await call('check_membership');
    if(btn){ btn.disabled = false; btn.textContent = '🔄 بررسی عضویت و ورود به بازی'; }
    if(res.membership?.is_member){
      userIsMember = true;
      membershipChecked = true;
      toast('عضویت در هر دو کانال تایید شد! خوش آمدید.');
      render();
    } else {
      userIsMember = false;
      membershipChecked = true;
      toast('هنوز در هر دو کانال عضو نشده‌اید.');
      render();
    }
  }

  function ownerLabel(code){
    if(!code) return '';
    const c = String(code).trim().toUpperCase();
    const owner = S?.owners?.[c] || S?.owners?.[c.toLowerCase()];
    if(!owner){
      if(S?.taken?.includes(c)) return '<small class="country-owner">👑 فرمانروا: انتخاب‌شده</small>';
      return '';
    }
    const name = String(owner.name || '').trim();
    const uname = String(owner.username || '').trim().replace(/^@/, '');
    const parts = [];
    if(name) parts.push(name);
    if(uname) parts.push('@' + uname);
    if(!parts.length && owner.uid) parts.push('کاربر ' + owner.uid);
    return `<small class="country-owner">👑 فرمانروا: ${esc(parts.join(' · ') || 'انتخاب‌شده')}</small>`;
  }

  function confirmCountry(code){
    const cData = COUNTRIES[code] || { name_fa: code };
    const question = `آیا مایلید کشور «${cData.name_fa}» را به عنوان مقر فرماندهی خود در سال ۱۹۳۰ انتخاب کنید؟ (این انتخاب غیرقابل بازگشت است)`;
    const run = async ok => {
      if(!ok) return;
      const res = await call('pick', { c: code });
      if(!res.err){
        toast(`کشور ${cData.name_fa} با موفقیت تصاحب شد.`);
        render();
      }
    };
    if(tg?.showConfirm) tg.showConfirm(question, run);
    else if(confirm(question)) run(true);
  }

    viewMode = mode;

  function searchCountries(val){
    q = val;

  }

          <div class="filter-chip ${filterFaction==='axis'?'active':''}" onclick="setFilterFaction('axis')"><img src="${FACTIONS.axis.badge}" style="width:14px;height:14px;"> دول محور</div>
          <div class="filter-chip ${filterFaction==='allies'?'active':''}" onclick="setFilterFaction('allies')"><img src="${FACTIONS.allies.badge}" style="width:14px;height:14px;"> متفقین</div>
          <div class="filter-chip ${filterFaction==='comintern'?'active':''}" onclick="setFilterFaction('comintern')"><img src="${FACTIONS.comintern.badge}" style="width:14px;height:14px;"> کمینترن</div>
          <div class="filter-chip ${filterFaction==='neutral'?'active':''}" onclick="setFilterFaction('neutral')"><img src="${FACTIONS.neutral.badge}" style="width:14px;height:14px;"> غیرمتعهد / بی‌طرف</div>
        </div>

        ${viewMode === 'map' ? `
          <div id="map-box"></div>
          <p class="muted" style="font-size:11px;text-align:center;">روی مرزهای تاریخی هر کشور کلیک کنید تا اطلاعات و دکمه تصاحب نمایش داده شود.</p>
        ` : `
          <div class="flag-grid">
            ${list.map(x => {
              const taken = (S?.taken||[]).includes(x.code);
              const fac = FACTIONS[x.faction] || {};
              const ideo = IDEOLOGIES[x.ideology] || {};
              return `
                <div class="country ${taken?'taken':''}" onclick="confirmCountry('${x.code}')">
                  <div class="flag-frame">
                    <img src="${x.flag_url}" alt="${x.name_fa}" loading="lazy" onerror="this.onerror=null;this.src='https://flagcdn.com/w160/${x.code.toLowerCase()}.png'">
                  </div>
                  <div class="country-name-txt">${esc(x.name_fa)}</div>
                  <div class="badges-line">
                    <img src="${fac.badge}" class="badge-icon" title="${fac.name}">
                    <img src="${ideo.badge}" class="badge-icon" title="${ideo.name}">
                  </div>
                  <div class="leader-tag">
                    <img src="${x.leader_img}" class="leader-avatar" onerror="this.onerror=null;this.src='${LEADER_FALLBACK}'">
                    <span class="leader-name-txt">${esc(x.leader)}</span>
                  </div>
                  ${taken ? ownerLabel(x.code) : ''}
                </div>
              `;
            }).join('') || '<div class="empty">کشوری با این مشخصات یافت نشد.</div>'}
          </div>
        `}
      </section>
    `;
  }

  function renderWaitScreen(p){
    const cData = COUNTRIES[p.c] || { name_fa: p.c, flag_url: '', leader: 'فرمانروا' };
    return `
      <section class="card hero">
        <div class="greeting">درود فرمانروا</div>
        <h1>${esc(cData.name_fa)}</h1>
        <img src="${cData.flag_url}" class="flag" onerror="this.onerror=null;this.src='https://flagcdn.com/w160/${p.c.toLowerCase()}.png'">
        <div class="pill">سال ۱۹۳۰ • در انتظار آغاز سیزن</div>
        <p class="muted" style="margin-top:12px;font-size:12px;">شما این کشور را با موفقیت انتخاب کرده‌اید. به زودی سیزن بازی با حضور سایر فرمانروایان کلید خواهد خورد.</p>
      </section>
      <div class="stats">
        <div class="stat"><div class="label">🏛 حکومت</div><strong>${IDEOLOGIES[cData.ideology]?.name || 'نامشخص'}</strong></div>
        <div class="stat"><div class="label">⚔️ ائتلاف</div><strong>${FACTIONS[cData.faction]?.name || 'نامشخص'}</strong></div>
      </div>
    `;
  }

  async function initMap(){
    const box = document.getElementById('map-box');
    if(!box || mapInstance) return;

    mapInstance = L.map('map-box', {
      center: [32, 35],
      zoom: 2,
      minZoom: 1.5,
      maxZoom: 6,
      zoomControl: true
    });

    // Dark military tile basemap
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; CartoDB',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(mapInstance);

    if(!geoData){
      try {
        const resp = await fetch('/world_geo.json');
        geoData = await resp.json();
      } catch(e) {
        console.error('Failed to load 1930 GeoJSON:', e);
        return;
      }
    }

    function getFactionColor(code){
      const c = COUNTRIES[code];
      if(!c) return '#33445c';
      if(c.faction === 'axis') return '#e63946';
      if(c.faction === 'allies') return '#457b9d';
      if(c.faction === 'comintern') return '#d62828';
      return '#8d99ae';
    }

    geoLayer = L.geoJSON(geoData, {
      style: feat => {
        const code = feat.properties?.code;
        const color = getFactionColor(code);
        return {
          fillColor: color,
          weight: 1.2,
          opacity: 0.8,
          color: '#1a2638',
          fillOpacity: code ? 0.65 : 0.25
        };
      },
      onEachFeature: (feat, layer) => {
        const code = feat.properties?.code;
        const cData = COUNTRIES[code];
        const name = cData?.name_fa || feat.properties?.NAME || 'سرزمین نامشخص';
        
        layer.on('mouseover', () => layer.setStyle({ weight: 2.5, color: '#f6c86b', fillOpacity: 0.85 }));
        layer.on('mouseout', () => geoLayer.resetStyle(layer));
        
        layer.on('click', () => {
          if(code && cData){
            const taken = (S?.taken||[]).includes(code);
            const fac = FACTIONS[cData.faction]?.name || '';
            const popupContent = `
              <div style="direction:rtl;text-align:right;font-family:Vazirmatn,sans-serif;min-width:180px;">
                <b style="font-size:14px;color:#f6c86b;">${esc(name)}</b>
                <div style="font-size:11px;color:#9aaac2;margin:4px 0;">رهبر: ${esc(cData.leader)}</div>
                <div style="font-size:11px;color:#64d6d0;margin-bottom:8px;">ائتلاف: ${esc(fac)}</div>
                ${taken ? '<span style="color:#ff7888;font-size:11px;">⚠️ این کشور تصاحب شده است</span>' :
                  `<button onclick="confirmCountry('${code}')" style="width:100%;padding:6px;background:#f6c86b;color:#182031;border:0;border-radius:6px;font-weight:700;font-size:11px;cursor:pointer;">⚔️ تصاحب کشور</button>`
                }
              </div>
            `;
            layer.bindPopup(popupContent).openPopup();
          } else {
            toast(`سرزمین: ${name}`);
          }
        });
      }
    }).addTo(mapInstance);
  }

  function render(){
    const app = $('#app');
    const pill = $('#season-pill');
    if(pill) pill.textContent = S?.season === 'wait' ? 'در انتظار شروع سیزن' : 'انتخاب کشور (۱۹۳۰)';

    // Step 1: Check mandatory channel join gate at the very start
    if(membershipChecked && !userIsMember){
      app.innerHTML = renderJoinGate();
      return;
    }

    // Step 2: If user already picked country and season is waiting
    if(S?.p?.c){
      app.innerHTML = renderWaitScreen(S.p);
      return;
    }

    // Step 3: Country selection screen
    app.innerHTML = renderPickScreen();
    if(viewMode === 'map'){
      setTimeout(initMap, 40);
    }
  }

  // Initialize app
  async function init(){
    const res = await call('state');
    if(!membershipChecked && res.membership){
      userIsMember = !!res.membership.is_member;
      membershipChecked = true;
    }
    render();
  }

  init();
</script>
</body>
</html>
